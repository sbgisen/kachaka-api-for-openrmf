name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linter:
    if: ${{ github.event_name == 'pull_request' }}
    name: Linter
    permissions:
      contents: read
      pull-requests: write
    uses: sbgisen/.github/.github/workflows/ros2_style.yaml@main

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install eclipse-zenoh==1.10.1 kachaka-api==3.17.5.0 pytest pyyaml

      - name: Show installed versions
        run: pip freeze | grep -E "kachaka|zenoh|pytest"

      - name: Run unit tests
        run: pytest test/ -v -m "not integration"
