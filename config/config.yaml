# Configuration for Kachaka API OpenRMF Bridge

# Method name translation: RMF method -> Kachaka API method
method_mapping:
  dock: return_home         # Dock command maps to return_home
  localize: switch_map      # Localize command maps to switch_map

# Map name translation: Display name -> Kachaka internal name
map_name_mapping:
  27F: L27                  # Floor 27 -> Kachaka map L27
  29F: L29                  # Floor 29 -> Kachaka map L29

# Timing configuration (all values in seconds)
timeouts:
  command_query: 2.0        # Timeout for command queries
  grpc_connection: 5        # Wait time between gRPC connection retries
  running_state_wait: 5.0   # Max wait time for RUNNING state after command sent
  grpc_telemetry: 5.0       # Timeout for telemetry gRPC calls (get_robot_pose, etc.)
  grpc_status_check: 5.0    # Timeout for command status gRPC calls (GetCommandState, etc.)
  grpc_stuck: 30.0          # Threshold (sec) for treating persistent Deadline Exceeded as a stuck channel
  command_completion: 180.0 # Watchdog: force failure completion when no RUNNING/completion observed for this long
  command_start: 15.0       # Max wait for RUNNING after an async command (move_to_pose/return_home) is dispatched
  motion_progress: 30.0     # Max time with no position/yaw change while RUNNING before treated as stuck
  own_return_home_retention: 5.0  # Grace period after any own async command completes during which a
  # lingering RUNNING state with the same command_id is still recognized as ours, not external (concern (b))

# Navigation tolerances (distances in meters, angles in radians)
navigation:
  # Set to true to enable the near-target short-circuit below (default off, see PR #48).
  noop_enabled: false
  # yamllint disable-line rule:line-length
  noop_distance_tolerance: 0.15          # Below this + yaw tolerance, skip Kachaka move_to_pose and report success directly
  noop_yaw_tolerance: 0.10
  progress_distance_delta: 0.02          # Minimum position change counted as motion progress while RUNNING
  progress_yaw_delta: 0.02               # Minimum yaw change counted as motion progress while RUNNING
  # Tolerance used to confirm a Kachaka success result actually reached the RMF-requested
  # target (see 7.3). Deliberately looser than noop_*: a real Kachaka move_to_pose success
  # can land 0.2-0.3m from the exact target, so a tight tolerance here would turn legitimate
  # successes into spurious failures. Matches the order of magnitude fleet_adapter_zenoh's
  # localize_guard uses for the same kind of "close enough" check.
  command_match_distance_tolerance: 0.75
  command_match_yaw_tolerance: 0.35

intervals:
  command_check: 1.0        # How often to check for new commands
  main_loop: 1              # How often to publish robot status

# Connection reliability settings
connection:
  max_retries: 20           # Max gRPC connection retries (startup / run_method path)
  # Max gRPC connection retries during command dispatch; kept small so a failed
  # dispatch returns a failure completion to RMF quickly instead of blocking
  # command handling for minutes.
  command_max_retries: 2
  max_consecutive_errors: 10  # Exit after this many consecutive errors

# Navigation retry settings
navigation_retry:
  enabled: true             # Enable automatic retry on navigation failure
  max_retries: 3            # Maximum number of retry attempts
  retry_interval: 2.0       # Wait time (seconds) before retrying
  retry_on_error_types:     # Error types that trigger automatic retry
    - Error                 # Retriable errors (may succeed on retry)

# Optional: Custom Zenoh config file path
# zenoh_config: "/path/to/zenoh.json5"

# Undock prefix before the first move off a charging dock (Issue #51).
# Disabled by default: with enabled=false the bridge behaves exactly as before
# (no extra gRPC calls are made on the move_to_pose path).
undock:
  enabled: false
  distance_m: 0.5           # Forward distance of the undock move; clamped to [0.3, 0.6]
  dock_radius_m: 0.5        # "On the dock" radius around a charge_station pose
  other_dock_vicinity_m: 0.5  # Reject the prefix if the undock endpoint lands this close to another dock
  lane_tolerance_m: 0.3     # Reject the prefix if the endpoint is farther than this from every configured lane
  timeouts:
    start: 15.0             # Max wait for RUNNING after the undock move is dispatched
    progress: 30.0          # Max time with no pose change while the undock move is RUNNING
    phase_total: 45.0       # Hard cap on the whole undock phase
  # Charge stations. Used as the charger-pose fallback when get_locations()
  # cannot be read, and (matched by proximity) for per-dock overrides.
  # Example:
  #   - name: dock_a
  #     map_name: 27F
  #     pose: [1.0, 2.0, 0.0]
  #     distance_m: 0.45      # optional per-dock override of undock.distance_m
  #     dock_radius_m: 0.5    # optional per-dock override of undock.dock_radius_m
  chargers: []
  # Lane segments the undock endpoint must stay near. The bridge has no nav
  # graph, so the relevant segments are listed explicitly. An empty list
  # disables the lane check. Example:
  #   - map_name: 27F
  #     start: [1.0, 2.0]
  #     end: [4.0, 2.0]
  lanes: []
